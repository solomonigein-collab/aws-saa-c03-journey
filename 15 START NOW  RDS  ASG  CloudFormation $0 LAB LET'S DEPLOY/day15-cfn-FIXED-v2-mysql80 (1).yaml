AWSTemplateFormatVersion: '2010-09-09'
Description: Day15 - FIXED - ASG + ALB + RDS Free Tier $0 - Solomon - Fixed MySQL version

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0a9725e6138ed7268
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0e60ad810626d2cfa,subnet-0b78aa88fec02c16c
  KeyName:
    Type: String
    Default: day2-key
  DBPassword:
    Type: String
    NoEcho: true
    Default: Day15-RDS-Pass123!

Resources:
  ALBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Day15 ALB SG Port 80
      GroupName: day15-alb-sg-cfn
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  InstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Day15 ASG instances SG
      GroupName: day15-asg-sg-cfn
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSG
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  RDSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Day15 RDS SG - 3306 only from ASG
      GroupName: day15-rds-sg-cfn
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref InstanceSG

  LT:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: day15-lt-golden-cfn
      LaunchTemplateData:
        ImageId: ami-0c02fb55956c7d316
        InstanceType: t3.micro
        KeyName: !Ref KeyName
        SecurityGroupIds: [!Ref InstanceSG]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y httpd mysql
            systemctl start httpd
            systemctl enable httpd
            echo "<h1>Day15 SUCCESS - $(hostname -f) - IP $(hostname -i)</h1>" > /var/www/html/index.html
            echo "<p>RDS Endpoint: ${DB.Endpoint.Address}</p>" >> /var/www/html/index.html
            for i in {1..15}; do
              mysql -h ${DB.Endpoint.Address} -u admin -p'${DBPassword}' -e "CREATE DATABASE IF NOT EXISTS day15db; USE day15db; CREATE TABLE IF NOT EXISTS visits (id INT AUTO_INCREMENT PRIMARY KEY, ip VARCHAR(45), ts TIMESTAMP DEFAULT CURRENT_TIMESTAMP); INSERT INTO visits (ip) VALUES ('$(hostname -i)');" && break || sleep 10
            done
            VISITS=$(mysql -h ${DB.Endpoint.Address} -u admin -p'${DBPassword}' -se "SELECT COUNT(*) FROM day15db.visits;" || echo "1")
            echo "<p>Visits count in RDS: $VISITS - PERSISTS after terminate!</p>" >> /var/www/html/index.html

  TG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: day15-tg-cfn
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckPath: /
      TargetType: instance

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: day15-alb-cfn
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ALBSG]
      Subnets: !Ref Subnets

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TG

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Day15 DB subnet group
      DBSubnetGroupName: day15-db-subnet-cfn
      SubnetIds: !Ref Subnets

  DB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: day15-db-cfn
      DBName: day15db
      Engine: mysql
      EngineVersion: '8.0'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref RDSSG]
      PubliclyAccessible: false
      MultiAZ: false
      DeletionProtection: false
      BackupRetentionPeriod: 0

  ASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: day15-asg-cfn
      MinSize: '1'
      MaxSize: '5'
      DesiredCapacity: '1'
      VPCZoneIdentifier: !Ref Subnets
      TargetGroupARNs: [!Ref TG]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      LaunchTemplate:
        LaunchTemplateId: !Ref LT
        Version: !GetAtt LT.LatestVersionNumber

  ScaleOutMorning:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref ASG
      ScheduledActionName: scale-out-8am
      Recurrence: 0 8 * * *
      MinSize: 1
      MaxSize: 5
      DesiredCapacity: 2

  ScaleInEvening:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref ASG
      ScheduledActionName: scale-in-8pm
      Recurrence: 0 20 * * *
      MinSize: 1
      MaxSize: 5
      DesiredCapacity: 1

Outputs:
  ALBDNS:
    Description: ALB DNS - Like ip-172-31-12-57 proof
    Value: !GetAtt ALB.DNSName
  RDSEndpoint:
    Value: !GetAtt DB.Endpoint.Address
  CleanupCommand:
    Value: aws cloudformation delete-stack --stack-name day15-stack
